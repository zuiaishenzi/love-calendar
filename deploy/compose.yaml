services:
  calendar:
    image: ${CALENDAR_IMAGE:?run through update.sh}
    restart: unless-stopped
    env_file: /opt/love-calendar/shared/.env
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /opt/love-calendar/shared/data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
