name: OurDays
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  OurDays:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 朝夕
        OurDaysServerURL: https://love.11215739.xyz:11961/
        NSMicrophoneUsageDescription: 用于在聊天中录制语音消息。
        NSCameraUsageDescription: 用于拍摄要发送或保存在回忆中的照片。
        NSPhotoLibraryUsageDescription: 用于选择聊天、备忘录和回忆中的照片与视频。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ourdays.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.8.0"
        CURRENT_PROJECT_VERSION: "10801"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  OurDays:
    build:
      targets:
        OurDays: all
    archive:
      config: Release
